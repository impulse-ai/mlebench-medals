# Full MLE-bench benchmark catalog — all 75 official competitions plus the
# spaceship-titanic tutorial comp, grouped by MLE-bench complexity tier.
# Source: openai/mle-bench experiments/splits/{low,medium,high}.txt.
#
# ⚠️  Runnability on the current bench-service infra (single Cloud Run instance,
#     CPU-only, /data on container memory, no Filestore/GPU): only the LOW tier
#     is expected to complete. MEDIUM/HIGH have multi-GB datasets and many need
#     GPUs — they will typically fail at data-prep or training until the worker
#     gets a GPU + Filestore-backed /data. Listed here for completeness.
